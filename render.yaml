services:
  - type: web
    name: release-notes-app
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: GITHUB_TOKEN
        sync: false        # 在 Render 控制台填，不要写进仓库
      - key: AI_API_KEY
        sync: false
      - key: AI_BASE_URL
        value: https://api.deepseek.com
      - key: AI_MODEL
        value: deepseek-chat
      - key: AI_RATE_LIMIT
        value: "20"
